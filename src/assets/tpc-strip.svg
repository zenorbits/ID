<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80">
  <!-- Row 0: y from 0 to 20 -->
  <polygon points="0,0 20,0 0,20" fill="#154e13" />
  <polygon points="20,0 20,20 0,20" fill="#80cc38" />
  <polygon points="20,0 40,0 40,20" fill="#ffffff" />
  <polygon points="20,0 20,20 40,20" fill="#2b801f" />
  <polygon points="40,0 60,0 40,20" fill="#1e6819" />
  <polygon points="60,0 60,20 40,20" fill="#b5e4aa" />
  <polygon points="60,0 80,0 80,20" fill="#439e24" />
  <polygon points="60,0 60,20 80,20" fill="#0e350d" />
  <polygon points="80,0 100,0 80,20" fill="#dff2dc" />
  <polygon points="100,0 100,20 80,20" fill="#1e6819" />
  <polygon points="100,0 120,0 120,20" fill="#61b827" />
  <polygon points="100,0 100,20 120,20" fill="#154e13" />

  <!-- Row 1: y from 20 to 40 -->
  <polygon points="0,20 20,20 20,40" fill="#61b827" />
  <polygon points="0,20 0,40 20,40" fill="#b5e4aa" />
  <polygon points="20,20 40,20 20,40" fill="#0e350d" />
  <polygon points="40,20 40,40 20,40" fill="#439e24" />
  <polygon points="40,20 60,20 60,40" fill="#ffffff" />
  <polygon points="40,20 40,40 60,40" fill="#154e13" />
  <polygon points="60,20 80,20 60,40" fill="#80cc38" />
  <polygon points="80,20 80,40 60,40" fill="#dff2dc" />
  <polygon points="80,20 100,20 100,40" fill="#154e13" />
  <polygon points="80,20 80,40 100,40" fill="#2b801f" />
  <polygon points="100,20 120,20 100,40" fill="#b5e4aa" />
  <polygon points="120,20 120,40 100,40" fill="#082207" />

  <!-- Row 2: y from 40 to 60 -->
  <polygon points="0,40 20,40 0,60" fill="#1e6819" />
  <polygon points="20,40 20,60 0,60" fill="#dff2dc" />
  <polygon points="20,40 40,40 20,60" fill="#80cc38" />
  <polygon points="40,40 40,60 20,60" fill="#1e6819" />
  <polygon points="40,40 60,40 60,60" fill="#0e350d" />
  <polygon points="40,40 40,60 60,60" fill="#80cc38" />
  <polygon points="60,40 80,40 80,60" fill="#2b801f" />
  <polygon points="60,40 60,60 80,60" fill="#b5e4aa" />
  <polygon points="80,40 100,40 80,60" fill="#ffffff" />
  <polygon points="100,40 100,60 80,60" fill="#154e13" />
  <polygon points="100,40 120,40 120,60" fill="#1e6819" />
  <polygon points="100,40 100,60 120,60" fill="#61b827" />

  <!-- Row 3: y from 60 to 80 -->
  <polygon points="0,60 20,60 20,80" fill="#0e350d" />
  <polygon points="0,60 0,80 20,80" fill="#2b801f" />
  <polygon points="20,60 40,60 40,80" fill="#b5e4aa" />
  <polygon points="20,60 20,80 40,80" fill="#154e13" />
  <polygon points="40,60 60,60 40,80" fill="#439e24" />
  <polygon points="60,60 60,80 40,80" fill="#dff2dc" />
  <polygon points="60,60 80,60 60,80" fill="#154e13" />
  <polygon points="80,60 80,80 60,80" fill="#80cc38" />
  <polygon points="80,60 100,60 100,80" fill="#082207" />
  <polygon points="80,60 80,80 100,80" fill="#439e24" />
  <polygon points="100,60 120,60 100,80" fill="#80cc38" />
  <polygon points="120,60 120,80 100,80" fill="#0e350d" />
</svg>
